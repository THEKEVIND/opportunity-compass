<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Opportunity Compass architecture</title>
  <desc id="desc">A candidate URL flows through a Strands agent, safe page inspection, deterministic scoring, and an evidence-backed decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#132642"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#76e4c4"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#f5fbff}.subtitle{font:400 17px system-ui,sans-serif;fill:#a9bfd6}
      .label{font:700 18px system-ui,sans-serif;fill:#f5fbff}.small{font:400 14px system-ui,sans-serif;fill:#bad0e5}
      .box{fill:#102b49;stroke:#3f6d91;stroke-width:2}.gate{fill:#173b43;stroke:#76e4c4;stroke-width:2}
      .reject{fill:#44243a;stroke:#f17ba7;stroke-width:2}.line{stroke:#76e4c4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" class="title">Opportunity Compass</text>
  <text x="60" y="96" class="subtitle">Evidence first. Reward second. Human attention only when it matters.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="175" width="190" height="120" rx="18" class="box"/>
    <text x="155" y="220" text-anchor="middle" class="label">Candidate URL</text>
    <text x="155" y="248" text-anchor="middle" class="small">Bounty · contest · issue</text>

    <rect x="330" y="175" width="210" height="120" rx="18" class="box"/>
    <text x="435" y="215" text-anchor="middle" class="label">Strands agent</text>
    <text x="435" y="243" text-anchor="middle" class="small">Plans evidence checks</text>
    <text x="435" y="266" text-anchor="middle" class="small">and resolves unknowns</text>

    <rect x="620" y="135" width="220" height="105" rx="18" class="box"/>
    <text x="730" y="178" text-anchor="middle" class="label">Safe inspection</text>
    <text x="730" y="205" text-anchor="middle" class="small">Public HTTPS · bounded text</text>

    <rect x="620" y="275" width="220" height="105" rx="18" class="gate"/>
    <text x="730" y="316" text-anchor="middle" class="label">Hard gates</text>
    <text x="730" y="343" text-anchor="middle" class="small">Source · deadline · fee · AI</text>

    <rect x="930" y="105" width="210" height="90" rx="18" class="gate"/>
    <text x="1035" y="143" text-anchor="middle" class="label">Pursue</text>
    <text x="1035" y="169" text-anchor="middle" class="small">Start smallest proof</text>

    <rect x="930" y="215" width="210" height="90" rx="18" class="box"/>
    <text x="1035" y="253" text-anchor="middle" class="label">Investigate</text>
    <text x="1035" y="279" text-anchor="middle" class="small">Resolve named evidence gap</text>

    <rect x="930" y="325" width="210" height="90" rx="18" class="reject"/>
    <text x="1035" y="363" text-anchor="middle" class="label">Reject</text>
    <text x="1035" y="389" text-anchor="middle" class="small">Discard and replace</text>
  </g>

  <path d="M250 235 H322" class="line"/>
  <path d="M540 215 C575 215 580 188 612 188" class="line"/>
  <path d="M540 255 C575 255 580 328 612 328" class="line"/>
  <path d="M840 187 C885 187 882 150 922 150" class="line"/>
  <path d="M840 235 H922" class="line"/>
  <path d="M840 328 C885 328 882 370 922 370" class="line"/>

  <text x="60" y="470" class="small">Language-model judgment organizes evidence; deterministic code controls eligibility.</text>
</svg>

