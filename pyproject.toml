[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opportunity-compass"
version = "0.1.0"
description = "A Strands-powered agent that verifies online earning opportunities before humans spend time on them."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "strands-agents>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
local = [
  "ollama>=0.6,<1",
]
demo = [
  "pillow>=12,<13",
]

[project.scripts]
opportunity-compass = "opportunity_compass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_compass"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
